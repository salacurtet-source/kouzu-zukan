<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>構図コンプリート図鑑</title>
<meta name="description" content="33構図の図鑑・お題ガチャ・ロケ地マップをまとめた撮影記録アプリ">
<meta name="theme-color" content="#FBF6EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="構図図鑑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400;1,9..144,600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  /* Layout: a café stamp card — 33 composition cards on warm milk paper; every composition you shoot earns a round coral stamp. Rounded friendly type, a pastel color per group. One bright theme by choice. */
  --bg:#FBF6EF; --card:#FFFFFF; --latte:#F4E9DC; --ink:#4A3428; --ink-2:#8A766A; --line:#EEE2D4; --dash:#E2D2C1; --dash-ink:#BFAB9A;
  --coral:#D9573A; --coral-deep:#B4442A; --coral-soft:#FCE5DC; --sage:#3F7A55; --sage-soft:#DFEFE4; --mustard:#EFAE34; --mustard-soft:#FFF1D2; --mustard-ink:#835500;
  --c-place:#FDEBBE; --c-line:#D7EDDD; --c-depth:#DAE8F5; --c-rhythm:#FADCD3;
  --guide:#7A5A49; --edge:#D9573A; --on-accent:#FFFFFF; --ov-line:#FFFFFF; --ov-mark:#FFD27A;
  --f-round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-serif:"Fraunces",Georgia,"Hiragino Mincho ProN",serif;
  --shadow:0 8px 22px rgb(120 86 58 / .08),0 1px 3px rgb(120 86 58 / .08);
  --r:18px;
  color-scheme:light;
}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-round);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:35}
img{max-width:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button,label.btn{touch-action:manipulation}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(118px + env(safe-area-inset-bottom,0px))}

/* header + stamp card */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:start}
.hello{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:15px;color:var(--coral);margin:0}
h1{font-weight:700;font-size:clamp(26px,7vw,38px);line-height:1.25;margin:2px 0 0;letter-spacing:.03em;word-break:keep-all;overflow-wrap:anywhere}
.sub{grid-column:1/-1;margin:4px 0 0;color:var(--ink-2);font-size:14px}
.sync{font-size:12px;font-weight:500;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow);margin-top:4px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dash)}
.sync.ok::before{background:var(--sage)} .sync.local::before{background:var(--coral)}
.stampcard{grid-column:1/-1;position:relative;margin-top:14px;background:var(--card);border-radius:22px;padding:16px 18px 14px;box-shadow:var(--shadow)}
.stampcard::before{content:"";position:absolute;inset:6px;border:1.5px dashed var(--line);border-radius:17px;pointer-events:none}
.sc-head{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sc-title{font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:16px;color:var(--ink-2)}
.sc-count{font-family:var(--f-serif);font-weight:600;font-size:16px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-count b{font-size:32px;color:var(--coral);font-weight:600;margin-right:3px}
.stamps{position:relative;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;margin-top:8px}
.stamps i{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--dash);display:grid;place-items:center;font-style:normal;font-family:var(--f-serif);font-size:10px;line-height:1;color:var(--dash-ink)}
.stamps i.on{border:0;background:var(--coral);color:var(--on-accent);transform:rotate(-10deg);box-shadow:0 2px 4px rgb(217 87 58 / .3)}
.stamps i.on svg{width:62%;height:62%}
.cheer{position:relative;margin:10px 0 0;font-weight:700;font-size:15px}
.cheer span{font-weight:500;font-size:13px;color:var(--ink-2);margin-left:8px}
.meta{grid-column:1/-1;margin:10px 4px 0;font-size:12.5px;color:var(--ink-2)}
body[data-tab="gacha"] .stamps,body[data-tab="spots"] .stamps,body[data-tab="gacha"] .sub,body[data-tab="spots"] .sub,body[data-tab="gacha"] .meta,body[data-tab="spots"] .meta{display:none}
.banner{margin:14px 0 0;background:var(--coral-soft);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--ink)}
main{margin-top:24px}

/* controls */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;line-height:1.4;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.static{cursor:default}
.chip.cdot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 1px rgb(74 52 40 / .15)}
.btn{font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;line-height:1.3}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--coral);color:var(--on-accent);border-color:var(--coral);box-shadow:0 3px 0 var(--coral-deep)}
.btn.accent:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral-deep)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--coral)}
.btn.armed{background:var(--coral);color:var(--on-accent);border-color:var(--coral)}
.btn.sm{min-height:36px;padding:5px 14px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.note{font-size:13.5px;color:var(--ink-2);margin:12px 0 0}
.muted{color:var(--ink-2);font-size:13px}
.sec-h{font-weight:700;font-size:20px;margin:0;display:flex;align-items:baseline;gap:10px}
.sec-h small,.cat-h small{font-family:var(--f-serif);font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* composition cards */
.cat-place{--cc:var(--c-place)} .cat-line{--cc:var(--c-line)} .cat-depth{--cc:var(--c-depth)} .cat-rhythm{--cc:var(--c-rhythm)}
.cat{margin-top:30px}
.cat-h{font-weight:700;font-size:19px;margin:0;display:flex;align-items:center;gap:10px}
.cat-h .dot{width:14px;height:14px;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 1px rgb(74 52 40 / .15)}
.contact{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cell{min-width:0}
.card{position:relative;display:flex;flex-direction:column;width:100%;height:100%;padding:8px 8px 12px;border:0;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);text-align:left;cursor:pointer;transition:transform .15s ease}
.card:active{transform:scale(.97)}
.thumb{display:block;position:relative;aspect-ratio:3/2;max-width:100%;border-radius:12px;background:var(--cc,var(--latte))}
.thumb>img,.thumb>.gd{display:block;width:100%;height:100%;border-radius:inherit;overflow:hidden}
.thumb>img{object-fit:cover}
.card .thumb{margin-bottom:8px}
.c-no{font-family:var(--f-serif);font-style:italic;font-size:12.5px;color:var(--ink-2);padding:0 4px;line-height:1.3}
.card b{font-weight:700;font-size:15px;line-height:1.4;padding:0 4px}
.c-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:12px;color:var(--ink-2);padding:2px 4px 0;margin:0}
.lv{color:var(--mustard);letter-spacing:1px}
.got{margin-left:auto;font-weight:700;color:var(--coral)}
.stamp{position:absolute;top:-9px;right:-9px;z-index:2;width:60px;height:60px;border-radius:50%;background:rgb(255 255 255 / .95);border:2.5px solid var(--coral);color:var(--coral);display:grid;place-content:center;justify-items:center;transform:rotate(-14deg);box-shadow:0 3px 8px rgb(217 87 58 / .25);font-weight:700;font-size:12.5px;line-height:1.15;pointer-events:none}
.stamp::before{content:"";position:absolute;inset:3px;border:1px dashed var(--coral);border-radius:50%;opacity:.7}
.stamp em{font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:12px}
.empty-line{margin:12px 0 0;font-size:13.5px;color:var(--sage);font-weight:700}

/* composition guides */
.gd *{vector-effect:non-scaling-stroke}
.gd .g{stroke:var(--guide);stroke-width:1;opacity:.3;fill:none}
.gd .a{stroke:var(--guide);stroke-width:1.5;opacity:.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
.gd .b{stroke:var(--guide);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.gd .s{fill:var(--edge);stroke:none}
.gd .o{stroke:var(--edge);stroke-width:1.8;fill:none}
.gd .sl{stroke:var(--edge);stroke-width:2.4;fill:none;stroke-linecap:round}
.gd .f{fill:var(--guide);opacity:.1;stroke:none}
.gd .f2{fill:var(--guide);opacity:.2;stroke:none}
.gd .d{stroke-dasharray:3 3}
.gd .r1,.gd .r2,.gd .r3,.gd .r4{stroke:var(--guide);fill:none;stroke-linejoin:round;stroke-linecap:round}
.gd .r1{stroke-width:2.4} .gd .r2{stroke-width:2;opacity:.65} .gd .r3{stroke-width:1.6;opacity:.42} .gd .r4{stroke-width:1.3;opacity:.25}
.gd.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;--guide:var(--ov-line);--edge:var(--ov-mark);filter:drop-shadow(0 0 1.5px rgb(0 0 0 / .7))}
.gd.ov .f,.gd.ov .f2{opacity:.18}

/* gacha */
.gacha{display:grid;gap:18px}
@media (min-width:860px){.gacha{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;gap:28px}}
.menu{position:relative;background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.menu-eye{display:flex;justify-content:space-between;gap:10px;margin:0 0 12px;font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:16px;color:var(--coral)}
.menu-eye span+span{color:var(--ink-2);font-style:normal}
.menu-body{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1fr);gap:14px;align-items:center}
.menu-body .thumb{border-radius:14px}
.g-name{font-weight:700;font-size:clamp(21px,6vw,30px);line-height:1.3;margin:0}
.g-count{margin:4px 0 2px;font-size:15px}
.g-count b{font-size:22px;color:var(--coral)}
.extras{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.extras li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:500}
.tagx{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--mustard-soft);color:var(--mustard-ink)}
.tagx.place{background:var(--sage-soft);color:var(--sage)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--coral);background:var(--coral-soft);border-radius:999px;padding:1px 9px;white-space:nowrap;line-height:1.7}
.g-tip{margin:16px 0 0;font-size:13.5px;color:var(--ink-2);background:var(--bg);border-radius:14px;padding:10px 14px}
.g-tip b{color:var(--ink);margin-right:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.spin-wrap{display:grid;gap:14px;align-content:start}
.spin{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border:0;border-radius:999px;background:var(--coral);color:var(--on-accent);font-weight:700;font-size:19px;letter-spacing:.06em;cursor:pointer;box-shadow:0 5px 0 var(--coral-deep);transition:transform .08s,box-shadow .08s}
.spin svg{width:26px;height:26px}
.spin:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-deep)}
.snap .menu{animation:pop .5s cubic-bezier(.2,.9,.3,1.25)}
.snap .spin svg{animation:roll .55s ease-out}
@keyframes pop{0%{transform:scale(.94) rotate(-1.5deg);opacity:.5}100%{transform:none;opacity:1}}
@keyframes roll{from{transform:rotate(-220deg)}to{transform:none}}
.g-opts{display:flex;flex-wrap:wrap;gap:6px}
.tgl{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.tgl::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--dash);background:var(--card)}
.tgl[aria-pressed="true"]::before{background:var(--sage);border-color:var(--sage);box-shadow:inset 0 0 0 3px var(--card)}
.tgl:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
section.chal{margin-top:38px}
section.hist{margin-top:30px}
.ch-list{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.ch-item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.thumb.mini{width:96px;border:0;padding:0;cursor:pointer;border-radius:10px}
.ch-body{display:grid;gap:6px;min-width:0}
.ch-title{margin:0;font-size:14px} .ch-title b{font-size:16px}
.ch-sub{margin:0;font-size:12.5px;color:var(--ink-2)}
.ch-act{display:flex;flex-wrap:wrap;gap:8px}
.hist-list{list-style:none;padding:0;margin:10px 0 0}
.hist-list li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:10px 2px;border-bottom:1px dashed var(--dash);font-size:14px}
.hist-list .d{font-family:var(--f-serif);font-size:13px;color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums}
.pill{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px}
.pill.done{background:var(--sage-soft);color:var(--sage)} .pill.skip{background:var(--latte);color:var(--ink-2)}
.link{border:0;background:none;padding:0;color:var(--coral);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit;font-weight:700}

/* spots */
.hot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.hot-l{font-size:13.5px;font-weight:700;margin-right:4px}
.map{margin-top:12px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.map svg{display:block;width:100%;height:auto}
.map .gr{stroke:var(--line);stroke-width:1}
.map .gl{font-family:var(--f-serif);font-size:10px;fill:var(--ink-2)}
.map .town path{stroke:var(--dash-ink);stroke-width:1.4;fill:none}
.map .town text{font-family:var(--f-round);font-size:11px;fill:var(--ink-2)}
.map .pin{cursor:pointer;outline:none}
.map .pin .dot{fill:var(--coral)}
.map .pin .ring{fill:none;stroke:var(--mustard);stroke-width:2.5;stroke-dasharray:4 3}
.map .pin:focus-visible .dot{stroke:var(--ink);stroke-width:2.5}
.map .pn{font-family:var(--f-serif);font-size:11px;font-weight:600;fill:var(--on-accent)}
.map .pl{font-family:var(--f-round);font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.map .ghost{font-family:var(--f-round);font-size:13px;fill:var(--ink-2)}
.map-note{margin:0;padding:10px 14px;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line)}
.spot-list{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.spot-row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;padding:14px;border:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer}
.pin-no{font-family:var(--f-serif);font-size:13px;font-weight:600;width:32px;height:32px;border-radius:50%;background:var(--coral);color:var(--on-accent);display:grid;place-items:center}
.sr-main{display:grid;gap:2px;min-width:0}
.sr-main b{font-size:15.5px;font-weight:700}
.sr-main small{font-size:12.5px;color:var(--ink-2)}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;max-width:240px;margin-top:6px}
.months i{height:8px;background:var(--latte);border-radius:99px;font-style:normal}
.months i.on{background:var(--sage)}
.months i.cur{outline:2px solid var(--coral);outline-offset:1px}
.months.lab{max-width:440px;gap:4px}
.months.lab i{height:auto;padding:4px 0;text-align:center;font-family:var(--f-serif);font-size:11.5px;color:var(--ink-2)}
.months.lab i.on{color:var(--on-accent)}
.empty{margin-top:16px;padding:16px 18px;background:var(--card);border:1.5px dashed var(--dash);border-radius:var(--r);font-size:14px;color:var(--ink-2)}
.empty p{margin:0 0 6px}
.empty b{color:var(--ink)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgb(74 52 40 / .35)}
.sheet{position:relative;width:min(780px,100%);max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 calc(28px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgb(74 52 40 / .18);animation:up .25s ease-out}
.sheet:focus{outline:none}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:820px){.sheet-wrap{align-items:center}.sheet{border-radius:24px;max-height:88%}}
.sh-head{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px 0 12px;border-bottom:1px dashed var(--dash)}
.sh-t{flex:1;min-width:0}
.sh-t h2{font-weight:700;font-size:22px;line-height:1.35;margin:2px 0 0;overflow-wrap:anywhere}
.eyebrow{font-family:var(--f-serif);font-style:italic;font-size:13.5px;color:var(--ink-2);margin:0}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
.sbody{display:grid;gap:4px;padding-top:16px}
.sbody p{margin:0}
.sbody h3{font-size:14px;font-weight:700;color:var(--ink);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sbody h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--coral)}
.sbody h3 small{font-family:var(--f-serif);font-weight:600;color:var(--ink-2)}
.thumb.hero{width:100%;max-width:560px;justify-self:center;border-radius:18px;margin-top:6px}
.lead{font-size:16px;line-height:1.9;margin-top:18px!important}
.thumbs{list-style:none;padding:0;margin:4px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tframe{display:block;width:100%;padding:5px 5px 4px;border:0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.tframe img,.tframe .rec{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:var(--latte)}
.tframe .rec{display:grid;place-items:center;color:var(--ink-2);font-size:11.5px}
.tcap{display:block;font-size:11.5px;color:var(--ink-2);padding:4px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
img.broken{visibility:hidden}
.viewer{display:flex;justify-content:center;background:var(--latte);border-radius:18px;padding:10px}
.ph{position:relative;max-width:100%}
.ph img{display:block;max-width:100%;max-height:64vh;width:auto;height:auto;border-radius:10px}
.ph-empty{width:100%;max-width:420px;aspect-ratio:3/2;display:grid;place-items:center;color:var(--ink-2);font-size:13px;font-weight:700}
.ph-empty .gd{position:absolute;inset:0;opacity:.5}
.ph-empty span{position:relative;background:var(--card);padding:4px 12px;border-radius:999px}
.ovbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ovbar>span{font-size:13px;color:var(--ink-2)}
.facts{display:grid;gap:8px;margin:16px 0 0;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.facts div{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px}
.facts dt{font-size:13px;color:var(--ink-2)} .facts dd{margin:0}
.mono{font-size:13px;font-variant-numeric:tabular-nums}
.memo{white-space:pre-wrap;background:var(--card);padding:12px 14px;border-radius:14px;font-size:14px;margin-top:12px!important;box-shadow:var(--shadow)}
.coord{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.coord code{font-family:var(--f-serif);font-size:15px;font-weight:600;user-select:all}
.coord-in{display:flex;gap:8px}
.coord-in input{flex:1}
.form-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.danger-row{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;padding-top:14px;border-top:1px dashed var(--dash)}

/* forms */
.form{display:grid;gap:18px;padding-top:16px}
.fld{display:grid;gap:6px}
.fld>span{font-size:13px;font-weight:700;color:var(--ink)}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--coral)}
textarea{resize:vertical;line-height:1.6}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.fs{border:0;padding:0;margin:0;display:grid;gap:12px;min-width:0}
.fs legend{font-size:13px;font-weight:700;color:var(--ink);padding:0;margin-bottom:8px}
.fs legend small{font-weight:400;color:var(--ink-2)}
.fs-g{display:grid;gap:6px}
.fs-l{font-size:12px;font-weight:700;color:var(--ink-2)}
.mchips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mchips .chip{padding:7px 0;justify-content:center}
.pick{display:grid;gap:10px;justify-items:start}
.pick-pv{width:100%;aspect-ratio:3/2;background:var(--latte);border-radius:16px;display:grid;place-items:center;overflow:hidden;color:var(--ink-2);font-size:13.5px}
.pick-pv img{width:100%;height:100%;object-fit:contain}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.exif-line{font-size:12.5px;color:var(--ink-2);margin:0}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.hint.ok{color:var(--sage);font-weight:700}
.err{color:var(--coral);font-size:13px;font-weight:700;margin:0}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgb(120 86 58 / .1);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{display:grid;justify-items:center;gap:1px;padding:6px 0 5px;border:0;border-radius:16px;background:none;color:var(--ink-2);cursor:pointer;font-size:12px;font-weight:700}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--coral);background:var(--coral-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(74 52 40 / .25);text-align:center}

@media (prefers-reduced-motion: reduce){
  .snap .menu,.snap .spin svg,.sheet{animation:none}
  .card,.spin{transition:none}
}
</style>
</head>

/* ---------- store: IndexedDB on this device ---------- */
const URLS = new Map(), MEM = new Map();

function sortAll() {

  S.spots.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

}
function listFor(kind) { return kind === 'photo' ? S.photos : kind === 'spot' ? S.spots : S.challenges; }

}

    for (const o of items) if (o && ['photo', 'spot', 'challenge'].includes(o.kind)) memPut(o);

/* ---------- backup ---------- */
function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }

async function exportBackup(btn) {
  if (btn.disabled) return;

  try {
    const blobs = {};
    for (const p of S.photos) for (const k of [p.img, p.thumb]) { if (!k || blobs[k]) continue; const b = await blobGet(k); if (b) blobs[k] = await blobToDataURL(b); }
    const data = { app: 'kouzu-zukan', version: 1, exportedAt: new Date().toISOString(), items: [...S.photos, ...S.spots, ...S.challenges], blobs };
    const name = 'kouzu-zukan-backup-' + today() + '.json';
    const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
    let shared = false;
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); shared = true; }

    }

  } catch (e) { toast('書き出せませんでした。もう一度お試しください'); }

async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== 'kouzu-zukan' || !Array.isArray(data.items)) throw { code: 'badbackup' };
    toast('読み込んでいます…');
    for (const [k, du] of Object.entries(data.blobs || {})) {
      if (typeof du !== 'string' || !du.startsWith('data:image/')) continue;
      const b = await (await fetch(du)).blob(); await blobPut(k, b);

    let n = 0;
    for (const it of data.items) { if (it && typeof it.id === 'string' && ['photo', 'spot', 'challenge'].includes(it.kind)) { await put(it, true); n++; } }
    sortAll(); await Promise.all(S.photos.map(p => loadUrl(p.thumb || p.img)));
    afterChange(); askPersist();
    toast(n + '件を読み込みました');
  } catch (e) { toast(e && e.code === 'badbackup' ? errMsg(e) : 'バックアップを読み込めませんでした'); }
}

    <div class="toolbar"><h2 class="sec-h">ロケ地マップ<small>${S.spots.length}か所</small></h2><button class="btn primary sm" data-act="add-spot">＋ ロケ地を追加</button></div>

  renderMap();

function renderMap() {
  const el = $('#map'); if (!el) return;
  const W = Math.round(Math.max(300, Math.min(el.clientWidth || 360, 1080)));
  const H = Math.round(W < 560 ? W * 0.78 : W * 0.5);
  const pts = S.spots.map((s, i) => ({ s, i })).filter(o => hasXY(o.s));
  let la0, la1, lo0, lo1;
  if (pts.length) {
    la0 = Math.min(...pts.map(o => o.s.lat)); la1 = Math.max(...pts.map(o => o.s.lat));
    lo0 = Math.min(...pts.map(o => o.s.lng)); lo1 = Math.max(...pts.map(o => o.s.lng));
    const pl = Math.max(0.03, (la1 - la0) * 0.2), pg = Math.max(0.04, (lo1 - lo0) * 0.2);
    la0 -= pl; la1 += pl; lo0 -= pg; lo1 += pg;
  } else { la0 = 40.10; la1 = 40.50; lo0 = 140.30; lo1 = 140.95; }
  const cy = (la0 + la1) / 2, cx = (lo0 + lo1) / 2, kx = Math.cos(cy * Math.PI / 180), m = 28;
  const sc = Math.min((W - 2 * m) / ((lo1 - lo0) * kx), (H - 2 * m) / (la1 - la0));
  const X = g => Math.round((W / 2 + (g - cx) * kx * sc) * 10) / 10;
  const Y = a => Math.round((H / 2 - (a - cy) * sc) * 10) / 10;
  const vla0 = cy - (H / 2) / sc, vla1 = cy + (H / 2) / sc, vlo0 = cx - (W / 2) / (kx * sc), vlo1 = cx + (W / 2) / (kx * sc);
  const steps = [0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1];
  const sa = steps.find(s => (vla1 - vla0) / s <= 6) || 1, so = steps.find(s => (vlo1 - vlo0) / s <= 6) || 1;
  const dec = s => s < 0.01 ? 3 : s < 0.1 ? 2 : 1;
  let g = '';
  for (let k = Math.ceil(vla0 / sa); k * sa <= vla1; k++) { const a = k * sa, y = Y(a); if (y < 14 || y > H - 18) continue; g += `<line class="gr" x1="0" y1="${y}" x2="${W}" y2="${y}"/><text class="gl" x="6" y="${y - 4}">${a.toFixed(dec(sa))}°N</text>`; }
  for (let k = Math.ceil(vlo0 / so); k * so <= vlo1; k++) { const o = k * so, x = X(o); if (x < 50 || x > W - 10) continue; g += `<line class="gr" x1="${x}" y1="0" x2="${x}" y2="${H}"/><text class="gl" x="${x + 4}" y="${H - 6}">${o.toFixed(dec(so))}°E</text>`; }
  let towns = '';
  for (const [n, a, o] of TOWNS) { if (a < vla0 || a > vla1 || o < vlo0 || o > vlo1) continue; const x = X(o), y = Y(a); towns += `<g class="town"><path d="M${x - 3.5} ${y}h7M${x} ${y - 3.5}v7"/><text x="${x + 7}" y="${y + 4}">${n}</text></g>`; }
  let pins = '';
  const label = pts.length <= 14;
  for (const { s, i } of pts) {
    const x = X(s.lng), y = Y(s.lat), hot = inSeason(s);
    const nm = s.name.length > 10 ? s.name.slice(0, 10) + '…' : s.name;
    pins += `<g class="pin" data-act="spot" data-id="${s.id}" role="button" tabindex="0" aria-label="${esc(s.name)}">${hot ? `<circle class="ring" cx="${x}" cy="${y}" r="15.5"/>` : ''}<circle class="dot" cx="${x}" cy="${y}" r="11"/><text class="pn" x="${x}" y="${y + 4}" text-anchor="middle">${i + 1}</text>${label ? `<text class="pl" x="${x + 16}" y="${y + 4}">${esc(nm)}</text>` : ''}</g>`;
  }
  const ghost = pts.length ? '' : `<text class="ghost" x="${W / 2}" y="${H / 2 + 34}" text-anchor="middle">ロケ地を登録するとピンが立ちます</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ロケ地の位置関係">${g}${towns}${pins}${ghost}</svg><p class="map-note">位置関係の目安です（地形は描いていません）。黄色い点線の輪は、今月がベストのロケ地です。正確な場所は各ロケ地の「Googleマップで開く」から。</p>`;
}

}

    let spotId = f.spotId;
    if (spotId === '__new') {
      const sp = { id: newId('s'), kind: 'spot', name: f.newSpotName.trim(), area: '', lat: +f.exif.lat.toFixed(6), lng: +f.exif.lng.toFixed(6), months: [], times: [], compIds: [...f.compIds], memo: '', createdAt: Date.now() };
      await put(sp); spotId = sp.id;
    }
    Object.assign(doc, { compIds: [...f.compIds], title: f.title.trim(), date: f.date || '', spotId: spotId || '', memo: f.memo.trim(), challengeId: f.challengeId || '' });
    await put(doc);
    if (f.challengeId) { const ch = S.challenges.find(x => x.id === f.challengeId); if (ch && ch.status === 'active') await put(Object.assign({}, ch, { status: 'done', doneAt: Date.now(), photoId: doc.id })); }
    oldAssets.forEach(k => blobDel(k));
    const fresh = [...f.compIds].filter(id => !before.has(id));
    goBack();
    toast(fresh.length ? `スタンプGET！「${CMAP[fresh[0]].name}」${fresh.length > 1 ? 'ほか' : ''}  ${before.size + fresh.length} / ${TOTAL}` : (f.challengeId ? 'お題クリア！おつかれさまでした' : '記録しました'));
  } catch (e) {
    f.busy = false; btn.disabled = false; btn.textContent = f.editId ? '変更を保存' : '記録する';
    toast(errMsg(e));
  }
}
async function delPhoto(id) {
  const p = S.photos.find(x => x.id === id); if (!p) return;
  goBack();
  try {
    await remove(p);
    [p.img, p.thumb].forEach(k => blobDel(k));
    toast('削除しました');
  } catch (e) { toast(errMsg(e)); }
}

/* ---------- spot form ---------- */
function newSpotForm() { S.form = { editId: null, name: '', area: '', coord: '', months: new Set(), times: new Set(), compIds: new Set(), memo: '' }; openSheet({ type: 'fspot' }); }
function editSpotForm(s) { S.form = { editId: s.id, name: s.name || '', area: s.area || '', coord: hasXY(s) ? `${s.lat}, ${s.lng}` : '', months: new Set(s.months || []), times: new Set(s.times || []), compIds: new Set(s.compIds || []), memo: s.memo || '' }; openSheet({ type: 'fspot' }); }
function coordHint(t) { if (!t) return '空欄でも登録できます（地図には出ません）'; const c = parseCoord(t); return c ? `読み取り：${fmtLat(c.lat)} ${fmtLng(c.lng)}` : '座標を読み取れません。「40.2714, 140.5644」の形で入れてください'; }
function formSpot() {
  const f = S.form; if (!f) return null;
  return `${head(f.editId ? 'ロケ地を編集' : 'ロケ地を追加', 'Spot')}
  <div class="form">
    <div class="grid2">
      <label class="fld"><span>名前（必須）</span><input id="s-name" data-f="name" value="${esc(f.name)}" placeholder="例：〇〇の棚田" maxlength="40"><span class="err" id="e-name" hidden>名前を入れてください</span></label>
      <label class="fld"><span>エリア</span><input id="s-area" data-f="area" value="${esc(f.area)}" placeholder="例：鹿角市" maxlength="30"></label>
    </div>
    <label class="fld"><span>座標</span><span class="coord-in"><input id="s-coord" data-f="coord" value="${esc(f.coord)}" placeholder="40.2714, 140.5644 またはGoogleマップのURL" autocomplete="off"><button type="button" class="btn sm" data-act="here">現在地</button></span><span class="hint" id="coordHint">${esc(coordHint(f.coord))}</span></label>
    <fieldset class="fs"><legend>ベストな月 <small>複数選べます</small></legend><div class="mchips">${Array.from({ length: 12 }, (_, i) => `<button type="button" class="chip" data-act="fchip" data-k="months" data-v="${i + 1}" aria-pressed="${f.months.has(i + 1)}">${i + 1}月</button>`).join('')}</div></fieldset>
    <fieldset class="fs"><legend>時間帯</legend><div class="chips">${TIMES.map(t => `<button type="button" class="chip" data-act="fchip" data-k="times" data-v="${t}" aria-pressed="${f.times.has(t)}">${t}</button>`).join('')}</div></fieldset>
    <fieldset class="fs"><legend>相性のいい構図</legend>
      ${CATS.map(cat => `<div class="fs-g"><span class="fs-l">${cat.n}</span><div class="chips">${COMPS.filter(c => c.cat === cat.k).map(c => `<button type="button" class="chip" data-act="fchip" data-k="compIds" data-v="${c.id}" aria-pressed="${f.compIds.has(c.id)}">${esc(c.name)}</button>`).join('')}</div></div>`).join('')}
    </fieldset>
    <label class="fld"><span>メモ</span><textarea id="s-memo" data-f="memo" rows="3" placeholder="駐車場、アクセス、足元、日の出の方角など">${esc(f.memo)}</textarea></label>
    <div class="form-act"><button class="btn primary wide" data-act="save-spot" id="saveSpot">${f.editId ? '変更を保存' : 'ロケ地を追加'}</button></div>
  </div>`;
}
async function saveSpot() {
  const f = S.form; if (!f || f.busy) return;
  if (S.mode === 'loading') { toast('接続中です。数秒待ってからもう一度押してください'); return; }
  if (!f.name.trim()) { $('#e-name').hidden = false; $('#s-name').focus(); return; }
  const c = f.coord.trim() ? parseCoord(f.coord) : null;
  if (f.coord.trim() && !c) { $('#s-coord').focus(); toast('座標を読み取れません'); return; }
  f.busy = true; const btn = $('#saveSpot'); btn.disabled = true; btn.textContent = '保存中…';
  try {
    const prev = f.editId ? spotById(f.editId) : null;
    const doc = Object.assign({}, prev || { id: newId('s'), kind: 'spot', createdAt: Date.now() }, {
      name: f.name.trim(), area: f.area.trim(), lat: c ? +c.lat.toFixed(6) : null, lng: c ? +c.lng.toFixed(6) : null,
      months: [...f.months].sort((a, b) => a - b), times: TIMES.filter(t => f.times.has(t)), compIds: [...f.compIds], memo: f.memo.trim()
    });
    await put(doc);
    goBack(); toast(prev ? '保存しました' : 'ロケ地を追加しました');
  } catch (e) { f.busy = false; btn.disabled = false; btn.textContent = f.editId ? '変更を保存' : 'ロケ地を追加'; toast(errMsg(e)); }
}
async function delSpot(id) {
  const s = spotById(id); if (!s) return;
  goBack();
  try { await remove(s); toast('ロケ地を削除しました'); } catch (e) { toast(errMsg(e)); }
}

/* ---------- interactions ---------- */
function arm(btn, label, fn) {
  if (btn.dataset.armed) { fn(); return; }
  const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; btn.classList.remove('armed'); } }, 4000);
}
function copyText(text, btn) {
  const ok = () => { const o = btn.textContent; btn.textContent = 'コピーしました'; setTimeout(() => { if (btn.isConnected) btn.textContent = o; }, 1600); };
  try {
    navigator.clipboard.writeText(text).then(ok, () => selectCoord());
  } catch (e) { selectCoord(); }
  function selectCoord() { const c = $('#sheet .coord code'); if (c) { const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('座標を選択しました。長押しでコピーできます'); } }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
  switch (a) {
    case 'tab': setTab(v); break;
    case 'cat': S.cat = v; savePrefs(); renderZukan(); break;
    case 'missing': S.onlyMissing = !S.onlyMissing; renderZukan(); break;
    case 'comp': S.ov = null; openSheet({ type: 'comp', id }); break;
    case 'photo': S.ov = null; openSheet({ type: 'photo', id }); break;
    case 'spot': openSheet({ type: 'spot', id }); break;
    case 'close': closeSheet(); break;
    case 'back': goBack(); break;
    case 'draw': draw(true); break;
    case 'gopt': S.g[v] = !S.g[v]; savePrefs(); renderGacha(); break;
    case 'glv': S.g.lv = +v; savePrefs(); renderGacha(); break;
    case 'accept': accept(); break;
    case 'ch-record': { const x = S.challenges.find(c => c.id === id); if (x) newPhotoForm({ compIds: [x.compId], spotId: x.spotId && spotById(x.spotId) ? x.spotId : '', challengeId: x.id }); break; }
    case 'ch-skip': skipChallenge(id); break;
    case 'add-photo': newPhotoForm({ compIds: [id] }); break;
    case 'add-photo-spot': newPhotoForm({ spotId: id }); break;
    case 'add-photo-free': newPhotoForm({}); break;
    case 'comp-chal': compChallenge(id); break;
    case 'add-spot': newSpotForm(); break;
    case 'edit-spot': { const s = spotById(id); if (s) editSpotForm(s); break; }
    case 'del-spot': arm(t, '本当に削除する', () => delSpot(id)); break;
    case 'edit-photo': { const p = S.photos.find(x => x.id === id); if (p) editPhotoForm(p); break; }
    case 'del-photo': arm(t, '本当に削除する', () => delPhoto(id)); break;
    case 'save-photo': savePhoto(); break;
    case 'save-spot': saveSpot(); break;
    case 'fchip': {
      const f = S.form; if (!f) break;
      const set = f[t.dataset.k]; const key = t.dataset.k === 'months' ? +v : v;
      if (set.has(key)) set.delete(key); else set.add(key);
      t.setAttribute('aria-pressed', String(set.has(key)));
      if (t.dataset.k === 'compIds') { const er = $('#e-comp'); if (er) er.hidden = true; }
      break;
    }
    case 'ov': S.ov = S.ov === id ? null : id; renderSheet(true); break;
    case 'copy': copyText(v, t); break;
    case 'data': openSheet({ type: 'data' }); break;
    case 'export': exportBackup(t); break;
    case 'here': {
      if (!navigator.geolocation) { toast(errMsg({ code: 'geo' })); break; }
      t.disabled = true; t.textContent = '取得中…';
      navigator.geolocation.getCurrentPosition(pos => {
        const v2 = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6);
        if (S.form) S.form.coord = v2;
        const i = $('#s-coord'); if (i) i.value = v2;
        const hnt = $('#coordHint'); if (hnt) hnt.textContent = coordHint(v2);
        if (t.isConnected) { t.disabled = false; t.textContent = '現在地'; }
      }, () => { toast(errMsg({ code: 'geo' })); if (t.isConnected) { t.disabled = false; t.textContent = '現在地'; } }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
      break;
    }
    case 'spot-draw': S.g.forceSpot = id; closeSheet(); setTab('gacha'); draw(true); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.f || !S.form) return;
  S.form[t.dataset.f] = t.value;
  if (t.dataset.f === 'coord') { const h = $('#coordHint'); if (h) h.textContent = coordHint(t.value); }
  if (t.dataset.f === 'name') { const er = $('#e-name'); if (er) er.hidden = true; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-file') { if (t.files && t.files[0]) onFile(t.files[0]); return; }
  if (t.id === 'impFile') { if (t.files && t.files[0]) importBackup(t.files[0]); t.value = ''; return; }
  if (t.dataset && t.dataset.f && S.form) {
    S.form[t.dataset.f] = t.value;
    if (t.dataset.f === 'spotId') { const n = $('#newSpotFld'); if (n) n.hidden = t.value !== '__new'; S.form.gpsNote = ''; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) { closeSheet(); return; }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON') { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG') t.classList.add('broken'); }, true);
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'spots') renderMap(); }, 150); });

/* ---------- start ---------- */
const h0 = (location.hash || '').replace('#', '');
if (['zukan', 'gacha', 'spots'].includes(h0)) S.tab = h0;
derive();
draw(false);
setTab(S.tab);
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
})();
</script>
</body>
</html>
